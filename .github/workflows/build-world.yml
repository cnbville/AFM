name: Build a world
# Builds a full world on GitHub's machines and publishes it on the public
# worlds page (github.com/cnbville/afm-worlds), where the game's library
# downloads it in one click (Cain 2026-10-21). A 30-year world takes about
# three hours. Needs the WORLDS_TOKEN secret: a token that may write to
# cnbville/afm-worlds. Every world gets a star mix check (`star_mix`: squad
# and signing stars by group, newcomers and leavers, the dynasty check) in
# the run's summary. With publish set to no it is a check world only, and
# with check set to a worlds page release it checks that world instead of
# building one; quick builds a stand-in world (`star_mix build`, about an
# hour for 8 years) for the check alone (lane 10 follow-up; Cain
# 2026-10-27: world runs go on GitHub).
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed"
        default: "2026"
      years:
        description: "Years of history"
        default: "30"
      publish:
        description: "Publish it on the worlds page (no for a check world)"
        default: "yes"
      check:
        description: "A worlds page release to check instead of building one (its tag)"
        default: ""
      quick:
        description: "A quick stand-in world for the star mix check only (yes or no)"
        default: "no"
jobs:
  world:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the world
        if: inputs.check == '' && inputs.quick != 'yes'
        env:
          AFM_COMMIT: ${{ github.sha }}
        run: |
          # The world log beside the world runs to tens of GB, so both go on
          # the runner's big temporary disk when it has one.
          if sudo mkdir -p /mnt/afm-out && sudo chown "$(id -u)" /mnt/afm-out; then ln -sfn /mnt/afm-out out; else mkdir -p out; fi
          cargo run --release --bin afm_world -- "${{ inputs.seed }}" "${{ inputs.years }}" out
          ls -la out/ && du -sh out/*
      - name: Download the world to check
        if: inputs.check != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cd out
          gh release download "${{ inputs.check }}" --repo cnbville/afm-worlds
          f=$(ls | sed -n 's/\(.*\.afmworld\)\.[0-9]*$/\1/p' | head -1)
          if [ -n "$f" ]; then cat "$f".* > "$f" && rm "$f".*; fi
          ls -la
      # A check that fails never stops a world from being published.
      - name: Star mix check
        continue-on-error: true
        run: |
          if [ "${{ inputs.quick }}" = yes ]; then
            cargo run --release --bin star_mix -- build "${{ inputs.seed }}" "${{ inputs.years }}" | tee star_mix.txt
          else
            cargo run --release --bin star_mix -- out/*.afmworld | tee star_mix.txt
          fi
          { echo '```'; cat star_mix.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: star-mix
          path: star_mix.txt
      # A release file may be at most 2 GB, so a bigger world goes up in parts
      # (name.afmworld.001, .002, ...), which the game joins.
      - name: Publish it on the worlds page
        if: inputs.publish != 'no' && inputs.check == '' && inputs.quick != 'yes'
        env:
          GH_TOKEN: ${{ secrets.WORLDS_TOKEN }}
        run: |
          repo=cnbville/afm-worlds
          gh api "repos/$repo/commits?per_page=1" > /dev/null 2>&1 || gh api -X PUT "repos/$repo/contents/README.md" \
            -f message="Start the downloads page" \
            -f content="$(printf '# AFM downloads\n\nReady-built worlds and the newest AFM for Mac. The game downloads from here by itself.\n' | base64 | tr -d '\n')"
          cd out
          f=$(ls *.afmworld)
          if [ "$(stat -c %s "$f")" -gt 2000000000 ]; then
            split -b 1900M -d -a 3 --numeric-suffixes=1 "$f" "$f."
            rm "$f"
          fi
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release create "${f%.afmworld}-$sha" ./*.afmworld* --repo cnbville/afm-worlds \
            --title "Seed ${{ inputs.seed }}, ${{ inputs.years }} years of history (game $sha)" \
            --notes "Built $(date -u +%Y-%m-%d) by the AFM game at commit ${{ github.sha }}."
          # The world log (world reader lane R2) goes up beside it as a tar
          # file in parts (name.afmlog.tar.001, ...), packed as the folder is
          # removed so the disk holds it once. The game does not download it.
          for l in *.afmlog; do
            [ -d "$l" ] || continue
            tar --remove-files -cf - "$l" | split -b 1900M -d -a 3 --numeric-suffixes=1 - "$l.tar."
            gh release upload "${f%.afmworld}-$sha" ./"$l".tar.* --repo cnbville/afm-worlds
          done
