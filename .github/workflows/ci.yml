name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The engine lib and its unit-test binary each take about 8 GB to compile.
      # Building the libraries first keeps the two from compiling at once.
      - run: cargo build --workspace --profile test
      - run: cargo test --workspace
