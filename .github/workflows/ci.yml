name: CI
# The quick check on every pull request and every push to main, about 20
# minutes: format, lints, the build and every test that doesn't build a world.
# The tests that build worlds (the screens' tests, the tools' world tests and
# the few unit tests skipped below) run in "Full tests" (full-tests.yml):
# nightly on main, by hand on any branch, and once on main before the world
# rebuild (Cain 2026-10-29: merge on a quick check, one finishing test).
on:
  push:
    branches: [main]
  pull_request:
# A newer push to a pull request stops its older check; every push to main
# gets its own.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Only main saves the cache, so the repository's 10 GB of caches hold
      # main's (which every pull request reads) instead of one per branch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The engine lib and its unit-test binary each take about 8 GB to compile.
      # Building the libraries first keeps the two from compiling at once.
      - run: cargo build --workspace --lib --profile test
      # Every unit test and the two quick integration tests. A test that builds
      # a world goes in the skips here and runs in full-tests.yml.
      - name: Quick tests
        run: >-
          cargo test --workspace --lib --test national_class --test match_engine --
          --skip tests::world_log::
          --skip lane_find::tests::
          --skip lane_logos::tests::your_own_logo_wins_and_stays_with_the_save
      - run: cargo test --workspace --doc
  # The desktop app (app/src-tauri, outside the workspace) is built on the Mac
  # only on main (mac-app.yml); this checks that it still compiles against the
  # game on every pull request.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: cargo check --manifest-path app/src-tauri/Cargo.toml
  # The same for the World Reader's desktop app (reader/src-tauri), which
  # reader-app.yml builds on the Mac only on main.
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reader/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - run: cargo check --manifest-path reader/src-tauri/Cargo.toml
