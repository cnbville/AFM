name: Mac app
# Builds AFM for macOS (Apple silicon and Intel in one app) and keeps the
# .dmg as the run's download (section 8, topic 9). It builds on every push to
# main that changes the game, and by hand on any branch (Actions, Mac app,
# Run workflow). Pull requests don't build it any more (Cain 2026-10-29): a
# Mac build per lane queued for hours behind GitHub's five Mac machines, then
# ran past its hour. ci.yml checks that the app still compiles on every pull
# request.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "tools/**", "legacy-ts/**", "crates/afm-tools/**", "crates/afm-reader/**",
      "crates/afm-reader-app/**", "reader/**", ".github/workflows/reader-app.yml",
      ".github/workflows/ci.yml", ".github/workflows/full-tests.yml", ".github/workflows/build-world.yml", ".github/scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
# One build at a time: a newer push waits, and replaces any push still
# waiting, so the newest main is always the next one built.
concurrency:
  group: mac-app-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Each chip on its own machine at the same time. The engine is one big
  # compile per chip (codegen-units = 1), so the two builds one after the
  # other took 45 to 90 minutes. Both build on Apple silicon: the Intel one
  # cross-compiles there, because GitHub's Intel Macs took 88 minutes for it.
  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    name: build (${{ matrix.target }})
    # macOS 15: GitHub retires its macOS 14 machines on 2026-11-02, and
    # their scheduled brownouts before that cancel jobs (Mac app runs 304
    # and 305 on 2026-10-30).
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Each build has its own version, 0.2.<run>, so an installed app knows a
      # newer one exists. Once the "Set up updates" workflow has made the
      # signing key (secret TAURI_SIGNING_PRIVATE_KEY, public half in the
      # variable TAURI_UPDATER_PUBKEY), the app carries its public half and the
      # bundle job below makes the signed update the app downloads. Both jobs
      # pass the same settings.
      - name: Build the app
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          conf=$(jq -cn --arg v "0.2.${{ github.run_number }}" '{version: $v}')
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            conf=$(echo "$conf" | jq -c --arg k "$PUBKEY" '. + {bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $k}}}')
          fi
          npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }} --no-bundle --config "$conf"
      - uses: actions/upload-artifact@v4
        with:
          name: afm-app-${{ matrix.target }}
          path: app/src-tauri/target/${{ matrix.target }}/release/afm-app
          if-no-files-found: error
          retention-days: 3
  # The two builds joined into one app (lipo), bundled, signed for updates and
  # published.
  bundle:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: afm-app-*
          path: built
      - name: Join the two builds
        working-directory: app/src-tauri
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p target/$t/release
            cp ../../built/afm-app-$t/afm-app target/$t/release/afm-app
            chmod +x target/$t/release/afm-app
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/afm-app \
            target/aarch64-apple-darwin/release/afm-app target/x86_64-apple-darwin/release/afm-app
          lipo -info target/universal-apple-darwin/release/afm-app
      - name: Bundle the app
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          conf=$(jq -cn --arg v "0.2.${{ github.run_number }}" '{version: $v}')
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            conf=$(echo "$conf" | jq -c --arg k "$PUBKEY" '. + {bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $k}}}')
          fi
          npx --yes @tauri-apps/cli@^2 bundle --target universal-apple-darwin --bundles app --config "$conf"
      # hdiutil on the hosted runners sometimes fails with "Resource busy", so
      # the .dmg is made here with retries instead of by Tauri's bundler.
      - name: Make the dmg
        working-directory: app/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          mkdir -p dmg stage
          cp -R macos/AFM.app stage/
          ln -s /Applications stage/Applications
          for i in 1 2 3 4 5; do
            hdiutil create -volname AFM -srcfolder stage -ov -format UDZO dmg/AFM_universal.dmg && exit 0
            sleep $((i * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: AFM-mac
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      # On main, the dmg is also put on a release, so the newest app always has
      # one plain download link: github.com/cnbville/AFM/releases/latest.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="app-${{ github.run_number }}"
          gh release create "$tag" app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/AFM_universal.dmg \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "AFM for Mac (build ${{ github.run_number }})" \
            --notes "The game for macOS, one app for Apple silicon and Intel. Unsigned: the first time, right-click AFM and choose Open."
      # On main, the newest app also goes to the public downloads page
      # (cnbville/afm-worlds, release "app-latest"): a download link that needs
      # no GitHub sign-in, and latest.json, where the installed app looks for
      # its updates. Needs the WORLDS_TOKEN secret.
      - name: Publish the update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.WORLDS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "No WORLDS_TOKEN secret yet: no public download or update."; exit 0; fi
          repo=cnbville/afm-worlds
          # A brand-new repository has no commit, and a release needs one.
          gh api "repos/$repo/commits?per_page=1" > /dev/null 2>&1 || gh api -X PUT "repos/$repo/contents/README.md" \
            -f message="Start the downloads page" \
            -f content="$(printf '# AFM downloads\n\nReady-built worlds and the newest AFM for Mac. The game downloads from here by itself.\n' | base64 | tr -d '\n')"
          b=app/src-tauri/target/universal-apple-darwin/release/bundle
          v="0.2.${{ github.run_number }}"
          url="https://github.com/$repo/releases/download/app-latest"
          files="$b/dmg/AFM_universal.dmg"
          if [ -f "$b/macos/AFM.app.tar.gz.sig" ]; then
            jq -n --arg v "$v" --arg s "$(cat "$b/macos/AFM.app.tar.gz.sig")" --arg u "$url/AFM.app.tar.gz" \
              --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "AFM $v, built from ${{ github.sha }}." \
              '{version: $v, notes: $n, pub_date: $d, platforms: {"darwin-aarch64": {signature: $s, url: $u}, "darwin-x86_64": {signature: $s, url: $u}}}' > latest.json
            files="$files $b/macos/AFM.app.tar.gz latest.json"
          fi
          gh release delete app-latest --repo "$repo" --cleanup-tag --yes || true
          gh release create app-latest $files --repo "$repo" --latest=false \
            --title "AFM for Mac $v" \
            --notes "The newest AFM for Mac (one app for Apple silicon and Intel). First install: open the dmg, drag AFM to Applications, then right-click AFM and choose Open. After that it updates itself."
