name: Mac app
# Builds AFM for macOS (Apple silicon and Intel in one app) and keeps the
# .dmg as the run's download (section 8, topic 9). It builds on every push to
# main that changes the game, and by hand on any branch (Actions, Mac app,
# Run workflow). Pull requests don't build it any more (Cain 2026-10-29): a
# Mac build per lane queued for hours behind GitHub's five Mac machines, then
# ran past its hour. ci.yml checks that the app still compiles on every pull
# request. Test-only data is skipped too: only afm-tools reads ab_real.json,
# and the Python scripts make data files without being read by the game.
#
# Two builds at a time, newest next (Cain 2026-11-15): runs of this workflow
# are split into two lanes by the last digit of the run number (even digit
# lane a, odd digit lane b, so merges alternate). Each lane is its own
# concurrency group without cancel-in-progress. A build that is already
# running is never killed. A merge that arrives while its lane is busy waits,
# and a newer merge in the same lane replaces the one that was waiting, so at
# most two builds compile and at most two wait, and the waiting ones are the
# newest merges (every build holds all earlier merges). Two builds use four of
# the five Mac machines GitHub gives a public repository, plus one for a
# bundle job. Each build only puts its dmg on its own release (app-<run>,
# never marked latest). The last job, "publish", runs one at a time and moves
# "latest" and the public downloads page to the highest finished build, never
# back, so a lane that finishes late can never put an older build on top
# (.github/scripts/mac-publish.sh).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "tools/**", "legacy-ts/**", "crates/afm-tools/**", "crates/afm-reader/**",
      "crates/afm-reader-app/**", "reader/**", ".github/workflows/reader-app.yml",
      "data/real-world/ab_real.json", "data/real-world/scripts/**",
      ".github/workflows/ci.yml", ".github/workflows/full-tests.yml", ".github/workflows/build-world.yml", ".github/workflows/mac-app.yml",
      ".github/scripts/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mac-app-build-${{ (endsWith(format('{0}', github.run_number), '0') || endsWith(format('{0}', github.run_number), '2') || endsWith(format('{0}', github.run_number), '4') || endsWith(format('{0}', github.run_number), '6') || endsWith(format('{0}', github.run_number), '8')) && 'a' || 'b' }}
  cancel-in-progress: false
jobs:
  # Each chip on its own machine at the same time. The engine is one big
  # compile per chip (codegen-units = 1), so the two builds one after the
  # other took 45 to 90 minutes. Both build on Apple silicon: the Intel one
  # cross-compiles there, because GitHub's Intel Macs took 88 minutes for it.
  build:
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    name: build (${{ matrix.target }})
    # macOS 15: GitHub retires its macOS 14 machines on 2026-11-02, and
    # their scheduled brownouts before that cancel jobs (Mac app runs 304
    # and 305 on 2026-10-30).
    runs-on: macos-15
    # A build takes about two hours now (Cain 2026-11-15), so the old 120
    # minute limit sat right on it and killed run 526 at the end.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The app carries its own entry on the What's new page: the merges since the
      # last shipped build, from the pull requests' Patch note sections (only the
      # working copy changes, nothing is committed; the "Patch notes" workflow
      # commits the real entry once the build ships). Never stops a build.
      - name: Put this build's notes on the What's new page
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PATCH_NOTES_NO_AI: "1"
        run: |
          python3 .github/scripts/patch_notes.py preview --version ${{ github.run_number }} --sha ${{ github.sha }}
          node --check app/ui/changelog.js || git checkout -- app/ui/changelog.js
      # Each build has its own version, 0.2.<run>, so an installed app knows a
      # newer one exists. Once the "Set up updates" workflow has made the
      # signing key (secret TAURI_SIGNING_PRIVATE_KEY, public half in the
      # variable TAURI_UPDATER_PUBKEY), the app carries its public half and the
      # bundle job below makes the signed update the app downloads. Both jobs
      # pass the same settings.
      - name: Build the app
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          conf=$(jq -cn --arg v "0.2.${{ github.run_number }}" '{version: $v}')
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            conf=$(echo "$conf" | jq -c --arg k "$PUBKEY" '. + {bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $k}}}')
          fi
          npx --yes @tauri-apps/cli@^2 build --target ${{ matrix.target }} --no-bundle --config "$conf"
      - uses: actions/upload-artifact@v4
        with:
          name: afm-app-${{ matrix.target }}
          path: app/src-tauri/target/${{ matrix.target }}/release/afm-app
          if-no-files-found: error
          retention-days: 3
  # The two builds joined into one app (lipo), bundled, signed for updates and
  # published.
  bundle:
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: afm-app-*
          path: built
      - name: Join the two builds
        working-directory: app/src-tauri
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            mkdir -p target/$t/release
            cp ../../built/afm-app-$t/afm-app target/$t/release/afm-app
            chmod +x target/$t/release/afm-app
          done
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/afm-app \
            target/aarch64-apple-darwin/release/afm-app target/x86_64-apple-darwin/release/afm-app
          lipo -info target/universal-apple-darwin/release/afm-app
      - name: Bundle the app
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          conf=$(jq -cn --arg v "0.2.${{ github.run_number }}" '{version: $v}')
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$PUBKEY" ]; then
            conf=$(echo "$conf" | jq -c --arg k "$PUBKEY" '. + {bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $k}}}')
          fi
          npx --yes @tauri-apps/cli@^2 bundle --target universal-apple-darwin --bundles app --config "$conf"
      # hdiutil on the hosted runners sometimes fails with "Resource busy", so
      # the .dmg is made here with retries instead of by Tauri's bundler.
      - name: Make the dmg
        working-directory: app/src-tauri/target/universal-apple-darwin/release/bundle
        run: |
          mkdir -p dmg stage
          cp -R macos/AFM.app stage/
          ln -s /Applications stage/Applications
          for i in 1 2 3 4 5; do
            hdiutil create -volname AFM -srcfolder stage -ov -format UDZO dmg/AFM_universal.dmg && exit 0
            sleep $((i * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: AFM-mac
          path: app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      # On main, the build's files go on a release of their own, never marked
      # latest: the dmg, and the signed in-app update with its latest.json
      # when signing is set up. The "publish" job below decides which build
      # is the newest, so a build that finishes late can never become latest.
      - name: Put the build on its own release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="app-${{ github.run_number }}"
          b=app/src-tauri/target/universal-apple-darwin/release/bundle
          v="0.2.${{ github.run_number }}"
          url="https://github.com/cnbville/afm-worlds/releases/download/app-latest"
          files="$b/dmg/AFM_universal.dmg"
          if [ -f "$b/macos/AFM.app.tar.gz.sig" ]; then
            jq -n --arg v "$v" --arg s "$(cat "$b/macos/AFM.app.tar.gz.sig")" --arg u "$url/AFM.app.tar.gz" \
              --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "AFM $v, built from ${{ github.sha }}." \
              '{version: $v, notes: $n, pub_date: $d, platforms: {"darwin-aarch64": {signature: $s, url: $u}, "darwin-x86_64": {signature: $s, url: $u}}}' > latest.json
            files="$files $b/macos/AFM.app.tar.gz latest.json"
          fi
          # Running this build's jobs again starts from a clean release.
          gh release delete "$tag" --repo "${{ github.repository }}" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" $files \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
            --title "AFM for Mac (build ${{ github.run_number }})" \
            --notes "The game for macOS, one app for Apple silicon and Intel. Unsigned: the first time, right-click AFM and choose Open."
  # Moves "latest" (github.com/cnbville/AFM/releases/latest) and the public
  # downloads page (cnbville/afm-worlds, release "app-latest": the dmg and
  # latest.json, where the installed app looks for its updates; needs the
  # WORLDS_TOKEN secret) to the highest finished build, and never back. One
  # run of this job at a time, on a cheap machine. If GitHub drops one that
  # was waiting, nothing is lost: the next one reads the same releases.
  publish:
    needs: bundle
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: mac-app-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Move latest and the downloads page forward
        env:
          REPO: ${{ github.repository }}
          AFM_TOKEN: ${{ github.token }}
          WORLDS_TOKEN: ${{ secrets.WORLDS_TOKEN }}
        run: bash .github/scripts/mac-publish.sh
