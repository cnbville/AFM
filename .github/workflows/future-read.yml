name: Future read
# Reads the future run's book (future-run.yml) and prints what it says into the
# job's log, round after round: the job fetches `.github/scripts/future-queries.sql`
# from the branch it was started on every minute and runs it again whenever
# it changes (a line `-- stop` ends the job), so the 8 GB book comes down once.
# One query a line; a line starting `--` is a heading, a line starting `page `
# prints a book page (`page money limit=300`), anything else is SQL for
# `afm_read sql`. Reading the book only; nothing is changed or published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The worlds page release holding the book (future-seed321-...)"
        default: ""
      minutes:
        description: "Minutes to wait for new queries after each round"
        default: "150"
permissions:
  contents: write
jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Make room
        run: .github/scripts/make-room.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile the reader
        run: cargo build --release -p afm-reader --bin afm_read
      - name: Download the book
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cd out
          gh release download "$TAG" --repo cnbville/afm-worlds --pattern '*.afmbook.zst*'
          ls -la
          f=$(ls | sed -n 's/\(.*\.afmbook\.zst\)\.[0-9]*$/\1/p' | head -1)
          if [ -n "$f" ]; then cat "$f".[0-9][0-9][0-9] | unzstd -T0 -c > "${f%.zst}" && rm "$f".[0-9][0-9][0-9]
          else unzstd -T0 --rm ./*.afmbook.zst; fi
          ls -la && df -h / /mnt
      - name: Read it
        env:
          BRANCH: ${{ github.ref_name }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          b=$(realpath out/*.afmbook)
          q=.github/scripts/future-queries.sql
          run_round() {
            rn=$1
            echo "######## ROUND $rn $(date -u +%H:%M)"
            while IFS= read -r line; do
              case "$line" in
                "") ;;
                "-- stop") ;;
                --*) echo; echo "=== ${line#-- }" ;;
                "page "*) echo; echo ">>> $line"; target/release/afm_read "$b" ${line#page } 2>&1 | head -c 40000 || true ;;
                "rsql "*) echo; echo ">>> $line"; target/release/afm_read "$b" sql "${line#rsql }" 2>&1 | head -c 60000 || true ;;
                "years "*)
                  # years <like pattern on the check id>: each check's own year series (its years_sql), cut to 2500 characters
                  pat="${line#years }"
                  echo; echo ">>> $line"
                  for id in $(sqlite3 "$b" "select id from checks where years_sql is not null and years_sql <> '' and id like '$pat' order by id"); do
                    echo "--- years $id"
                    sqlite3 "$b" "select title || ' (' || coalesce(unit,'') || ') real=' || coalesce(real,'') || ' world=' || coalesce(world,'') from checks where id='$id'"
                    ysql=$(sqlite3 "$b" "select years_sql from checks where id='$id'")
                    sqlite3 -header -separator ' | ' "$b" "$ysql" 2>&1 | head -c 2500 || true
                  done ;;
                "panels "*)
                  # panels <max> <like pattern on the title>: each matching panel whole, cut to 3000 characters
                  read -r n pat <<< "${line#panels }"
                  echo; echo ">>> $line"
                  for id in $(sqlite3 "$b" "select id from panels where title like '$pat' order by id limit $n"); do
                    echo "--- panel $id"; target/release/afm_read "$b" panel "$id" 2>&1 | head -c 3000 || true
                  done ;;
                *) echo; echo ">>> $line"; sqlite3 -header -separator ' | ' "$b" "$line" 2>&1 | head -c 60000 || true ;;
              esac
            done < "$q"
            echo "######## END ROUND $rn"
          }
          # each round's text goes to the branch too (a running job's log can't be read)
          push_round() {
            mkdir -p future-out && head -c 900000 "round-$1.txt" > "future-out/r${GITHUB_RUN_ID}-$1.txt"
            git config user.name future-read && git config user.email future-read@users.noreply.github.com
            git add future-out && git commit -q -m "Future read: run ${GITHUB_RUN_ID} round $1 output" || return 0
            for i in 1 2 3 4; do
              git pull -q --rebase --autostash origin "$BRANCH" && git push -q origin "HEAD:$BRANCH" && break
              sleep 5
            done
          }
          round=1
          run_round $round 2>&1 | tee round-$round.txt | tail -n 3
          push_round $round
          last=$(sha256sum "$q" | cut -d' ' -f1)
          end=$((SECONDS + MINUTES * 60))
          while [ $SECONDS -lt $end ]; do
            grep -qx -- '-- stop' "$q" && break
            sleep 45
            git fetch -q origin "$BRANCH" && git checkout -q FETCH_HEAD -- "$q" || continue
            now=$(sha256sum "$q" | cut -d' ' -f1)
            if [ "$now" != "$last" ]; then
              last=$now; round=$((round+1))
              run_round $round 2>&1 | tee round-$round.txt | tail -n 3
              push_round $round
              end=$((SECONDS + MINUTES * 60))
            fi
          done
