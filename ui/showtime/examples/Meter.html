<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../showtime.css"><title>Meter</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"><style>body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="st" style="padding:20px;display:grid;gap:16px">
<div class="st-meters" style="--accent:#bf5700">
 <div class="st-meter"><span>Get-off</span><span class="t"><i style="width:94%"></i></span><b>94</b></div>
 <div class="st-meter"><span>Bend</span><span class="t"><i style="width:86%"></i></span><b>86</b></div>
 <div class="st-meter"><span>Run defense</span><span class="t"><i style="width:68%"></i></span><b>68</b></div>
 <div class="st-meter est"><span>Coverage</span><span class="t"></span><b>Film</b></div>
</div>
<div class="st-scale"><div class="track"><span class="knob" style="left:68%"></span></div><div class="ends"><span>You lose</span><span>Even</span><span>You win</span></div></div>
</div>
</body>
</html>
