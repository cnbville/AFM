<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../showtime.css"><title>Button</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap"><style>body{margin:0;background:var(--ground)}</style></head>
<body>
<div class="st" style="padding:20px;display:grid;gap:16px">
<div class="st-actions">
 <button class="st-btn primary"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>Start mock draft</button>
 <button class="st-btn glass">My board</button>
 <button class="st-btn glass small">Auto-pick</button>
 <button class="st-btn primary" disabled>Draft</button>
 <button class="st-icon-btn" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</div>
</body>
</html>
