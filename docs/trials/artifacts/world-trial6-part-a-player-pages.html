<meta charset="utf-8">
<title>AFM Player Pages, part A check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: same manager-desk shell as the world mockup. Player list on the left, one dense player page on the right. Dark only. */
:root{
  --ink:#0f1513; --panel:#16201c; --panel2:#1c2823; --line:#2a3832; --text:#e3ebe6; --mute:#8fa39a;
  --turf:#3fae6a; --chalk:#f1f5f2; --gold:#e3b341; --red:#e0574f; --blue:#5aa4e6; --debug:#c77dff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:2px solid var(--turf);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--chalk)}
.brand span{color:var(--turf)}
.ctx{font-family:var(--display);font-size:16px;color:var(--mute)}
.spacer{flex:1}
.dbg{font-size:12px;color:var(--debug);cursor:pointer;border:1px solid var(--debug);padding:4px 10px;border-radius:3px;background:none;font-family:var(--body)}
.dbg[aria-pressed="true"]{background:var(--debug);color:var(--ink)}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100% - 50px)}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 50px)}
aside h3{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 14px 4px;font-weight:600}
.pl{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 14px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.pl:hover{background:var(--panel2)}
.pl[aria-current="true"]{background:var(--panel2);box-shadow:inset 3px 0 var(--turf)}
.pl:focus-visible{outline:2px solid var(--turf);outline-offset:-2px}
.pl b{font-weight:600}
.pl small{color:var(--mute);font-size:12px}
.pl .pos{font-family:var(--mono);font-size:12px;color:var(--gold);text-align:right}
main{padding:16px;min-width:0}
h1{font-family:var(--display);font-size:30px;font-weight:700;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:0 0 10px}
.sub{color:var(--mute);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.04em;background:rgba(63,174,106,.15);color:var(--turf)}
.chip.warn{background:rgba(227,179,65,.15);color:var(--gold)}
.chip.bad{background:rgba(224,87,79,.15);color:var(--red)}
.grid{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box{background:var(--panel);border:1px solid var(--line);padding:14px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv span:nth-child(odd){color:var(--mute)}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
.attrs{display:flex;flex-direction:column;gap:5px}
.ar{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.ar .num{font-family:var(--mono);text-align:right}
.track{position:relative;height:8px;background:var(--panel2)}
.track .cur{position:absolute;inset:0 auto 0 0;background:var(--turf)}
.track .ceil{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--debug);display:none}
body.debug .track .ceil{display:block}
.hi .cur{background:var(--gold)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:500;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{font-family:var(--mono);text-align:right}
.scroll{overflow-x:auto}
.dbgcol{display:none;color:var(--debug)}
body.debug .dbgcol{display:table-cell}
.hidden-val{display:none}
body.debug .hidden-val{display:block}
.debugnote{border:1px dashed var(--debug);color:var(--debug);font-size:12px;padding:8px 10px;margin-top:10px}
.story{margin:0;padding-left:18px;line-height:1.55}
.todo{border:1px dashed var(--line);color:var(--mute);padding:10px;font-size:13px}
.role-starter{color:var(--turf)}.role-redshirt{color:var(--gold)}.role-backup{color:var(--mute)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}aside{max-height:260px}}
</style>

<header class="top">
  <div class="brand">AFM<span>.</span></div>

</header>

  <main id="main"></main>
</div>

  const statT = cs.length?`<div class="box scroll" style="margin-top:12px"><h2>College stats (match engine)</h2><table><tr><th class="n">Year</th><th>School</th><th>Pos</th><th class="n">G</th><th class="n">Cmp/Att</th><th class="n">Pass yds</th><th class="n">TD</th><th class="n">INT</th><th class="n">Car</th><th class="n">Rush yds</th><th class="n">TD</th><th class="n">Rec</th><th class="n">Rec yds</th><th class="n">TD</th><th class="n">Tkl</th><th class="n">TFL</th><th class="n">Sacks</th><th class="n">INT</th><th class="n">PBU</th><th class="n">Pressures</th><th class="n">FG</th><th class="n">Grade</th></tr>${cs.map(s=>`<tr><td class="n">${s.year}</td><td>${s.school}</td><td>${s.pos??"·"}</td><td class="n">${s.g}</td><td class="n">${s.cmp}/${s.att}</td><td class="n">${s.pyd}</td><td class="n">${s.ptd}</td><td class="n">${s.int}</td><td class="n">${s.car}</td><td class="n">${s.ryd}</td><td class="n">${s.rtd}</td><td class="n">${s.rec}</td><td class="n">${s.recyd}</td><td class="n">${s.rectd}</td><td class="n">${s.tkl}</td><td class="n">${s.tfl}</td><td class="n">${s.sacks}</td><td class="n">${s.dint}</td><td class="n">${s.pbu}</td><td class="n">${s.pr}</td><td class="n">${s.fg}</td><td class="n">${s.grade}</td></tr>`).join("")}</table><p style="color:var(--mute);font-size:12px">Every college game he played, from the match engine. Known engine gaps (too much offense, few sacks) show here too.</p></div>`:"";
  document.getElementById("main").innerHTML = `
  <h1>${c.name} <span style="color:var(--gold)">${c.pos}</span></h1>
  <div class="sub">${c.hs} (${c.state}) · ${c.stars}-star · ${c.path}${c.team?" · "+c.team:""}${c.gpa!=null?" · core GPA "+c.gpa.toFixed(2):""}</div>
  <div class="tags"><span class="chip ${c.tag.includes("left")?"bad":""}">${c.tag}</span>${c.pick?`<span class="chip warn">${c.year} · round ${c.round}, pick ${c.pick}</span>`:""}<span class="chip">Overall when he left ${c.overall}</span></div>
  <div class="grid">
    <div class="box"><h2>Story</h2><ul class="story">${c.notes.map(n=>`<li>${n}</li>`).join("")}</ul></div>
    <div class="box"><h2>Measurables and combine</h2><div class="kv"><span>Height</span><span>${b.height}</span><span>Weight</span><span>${b.weight} lb</span><span>Arm</span><span>${frac(b.arm)}</span><span>Hand</span><span>${frac(b.hand)}</span><span>Wingspan</span><span>${frac(b.wingspan)}</span><span>40-yard dash</span><span>${k.forty}s</span><span>Bench (225)</span><span>${k.bench} reps</span><span>Vertical</span><span>${k.vertical}"</span><span>Broad jump</span><span>${Math.floor(k.broad/12)}'${k.broad%12}"</span><span>3-cone</span><span>${k.cone}s</span><span>Shuttle</span><span>${k.shuttle}s</span></div>
      <p style="color:var(--mute);font-size:12px;margin:8px 0 0">Body when he left. Combine numbers are one test day, so they carry real noise.</p>
      <h2 style="margin-top:14px">Hidden profile</h2>
      <div class="hidden-val"><div class="kv"><span>True potential</span><span>${c.potential}</span><span>Senior-year visibility</span><span>${c.visibility}</span><span>Work ethic</span><span>${p.work_ethic}</span><span>Coachability</span><span>${p.coachability}</span><span>Competitiveness</span><span>${p.competitiveness}</span><span>Love of the game</span><span>${p.love_of_game}</span><span>Injury proneness</span><span>${c.injury}</span><span>Bloom (years, minus = early)</span><span>${c.bloom}</span></div>
      <p style="color:var(--mute);font-size:12px;margin:10px 0 0">${c.background}</p>
      <div class="debugnote">Debug only. Personality and background are 1-20 and 0-1. The game shows scouted words, never these.</div></div>
      <p style="color:var(--mute);font-size:13px;margin:0" class="public-hint">Switch on debug view to see potential, personality and background.</p></div>
  </div>
  <div class="grid">${attrs}</div>
  <p style="color:var(--mute);font-size:12px;margin:6px 0 0">Attributes when he left, on the 1-99 pro scale. Gold bars are the key attributes for his position. In debug view, the purple tick is his hidden ceiling.</p>
  <div class="box scroll" style="margin-top:12px"><h2>Season by season</h2><table>
   <tr><th class="n">Age</th><th>Level</th><th>Role</th><th class="n">Rating in</th><th class="n">Rating out</th><th class="n">Played at</th><th class="n">Level rating in</th><th class="n">Level rating out</th><th class="n dbgcol">Potential</th><th>What happened</th></tr>${seasons}</table>
   <p style="color:var(--mute);font-size:12px">"Played at" is his on-field level that season, with form, slumps and breakouts. A redshirt row is a season without games, such as sitting out after a transfer. The level rating compares him with players at his level and age ("89 among seniors"). "What happened" gives the reasons behind a season: injuries with the games they cost, slumps, breakouts, the first-year dip at a new level (0 is ready at once, 1 a very hard first year), and a spring breakout, which comes after the season except an early enrollee's first college spring, before his first college season (its gain is already in "Rating out").</p>${staffT}<p></p></div>${statT}`;
  document.querySelectorAll(".public-hint").forEach(e=>e.hidden=document.body.classList.contains("debug"));
}
const dbg=document.getElementById("dbg");
dbg.onclick=()=>{const on=dbg.getAttribute("aria-pressed")!=="true";dbg.setAttribute("aria-pressed",on);document.body.classList.toggle("debug",on);show()};
list();show();
</script>
