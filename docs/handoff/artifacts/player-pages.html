<title>AFM Player Pages</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: same manager-desk shell as the world mockup. Player list on the left, one dense player page on the right. Dark only. */
:root{
  --ink:#0f1513; --panel:#16201c; --panel2:#1c2823; --line:#2a3832; --text:#e3ebe6; --mute:#8fa39a;
  --turf:#3fae6a; --chalk:#f1f5f2; --gold:#e3b341; --red:#e0574f; --blue:#5aa4e6; --debug:#c77dff;
  --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:14px}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:2px solid var(--turf);flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.06em;color:var(--chalk)}
.brand span{color:var(--turf)}
.ctx{font-family:var(--display);font-size:16px;color:var(--mute)}
.spacer{flex:1}
.dbg{font-size:12px;color:var(--debug);cursor:pointer;border:1px solid var(--debug);padding:4px 10px;border-radius:3px;background:none;font-family:var(--body)}
.dbg[aria-pressed="true"]{background:var(--debug);color:var(--ink)}
.wrap{display:grid;grid-template-columns:260px 1fr;min-height:calc(100% - 50px)}
aside{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 50px)}
aside h3{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:14px 14px 4px;font-weight:600}
.pl{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 14px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.pl:hover{background:var(--panel2)}
.pl[aria-current="true"]{background:var(--panel2);box-shadow:inset 3px 0 var(--turf)}
.pl:focus-visible{outline:2px solid var(--turf);outline-offset:-2px}
.pl b{font-weight:600}
.pl small{color:var(--mute);font-size:12px}
.pl .pos{font-family:var(--mono);font-size:12px;color:var(--gold);text-align:right}
main{padding:16px;min-width:0}
h1{font-family:var(--display);font-size:30px;font-weight:700;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:0 0 10px}
.sub{color:var(--mute);margin-top:2px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;font-family:var(--mono);padding:2px 7px;border-radius:2px;text-transform:uppercase;letter-spacing:.04em;background:rgba(63,174,106,.15);color:var(--turf)}
.chip.warn{background:rgba(227,179,65,.15);color:var(--gold)}
.chip.bad{background:rgba(224,87,79,.15);color:var(--red)}
.grid{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.box{background:var(--panel);border:1px solid var(--line);padding:14px;min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv span:nth-child(odd){color:var(--mute)}
.kv span:nth-child(even){font-family:var(--mono);text-align:right}
.attrs{display:flex;flex-direction:column;gap:5px}
.ar{display:grid;grid-template-columns:120px 1fr 30px;gap:8px;align-items:center;font-size:13px}
.ar .num{font-family:var(--mono);text-align:right}
.track{position:relative;height:8px;background:var(--panel2)}
.track .cur{position:absolute;inset:0 auto 0 0;background:var(--turf)}
.track .ceil{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--debug);display:none}
body.debug .track .ceil{display:block}
.hi .cur{background:var(--gold)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left}
th{font-weight:500;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
td.n,th.n{font-family:var(--mono);text-align:right}
.scroll{overflow-x:auto}
.dbgcol{display:none;color:var(--debug)}
body.debug .dbgcol{display:table-cell}
.hidden-val{display:none}
body.debug .hidden-val{display:block}
.debugnote{border:1px dashed var(--debug);color:var(--debug);font-size:12px;padding:8px 10px;margin-top:10px}
.story{margin:0;padding-left:18px;line-height:1.55}
.todo{border:1px dashed var(--line);color:var(--mute);padding:10px;font-size:13px}
.role-starter{color:var(--turf)}.role-redshirt{color:var(--gold)}.role-backup{color:var(--mute)}
@media (max-width:760px){.wrap{grid-template-columns:1fr}aside{max-height:260px}}
</style>

<header class="top">
  <div class="brand">AFM<span>.</span></div>
  <div class="ctx">Player pages · world trial 3 · seed 2026 · 15 years on the match engine</div>
  <div class="spacer"></div>
  <button class="dbg" id="dbg" type="button" aria-pressed="false">Debug view: show hidden numbers</button>
</header>
<div class="wrap">
  <aside id="list" aria-label="Players"></aside>
  <main id="main"></main>
</div>
