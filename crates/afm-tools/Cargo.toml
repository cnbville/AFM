[package]
name = "afm-tools"
description = "Calibration and trial tooling for the AFM engine (debug only: sees hidden potential)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
afm-engine = { workspace = true, features = ["debug"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.12"

[dev-dependencies]
rayon = "1.12"
