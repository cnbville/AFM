[package]
name = "afm-reader"
description = "The world reader's book: a world, its log and the real index in one SQLite file, and afm_read (debug only: sees hidden potential)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
afm-engine = { workspace = true, features = ["debug"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
rmp = "0.8"
rmpv = { version = "1", features = ["with-serde"] }
rmp-serde = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = "0.13"
rayon = "1.12"
mimalloc = "0.1.52"

[[bin]]
name = "afm_read"
path = "src/bin/afm_read.rs"
