[package]
name = "afm-engine"
description = "AFM simulation engine: players, development, scouting, recruiting, the draft and pro careers."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Debug and trial tooling only: exposes true potential and hidden ceilings.
# The game itself must never enable this.
debug = []

[dependencies]
rayon = "1.12"
rmp-serde = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0.154"
zstd = "0.13"
