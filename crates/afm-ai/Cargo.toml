[package]
name = "afm-ai"
description = "The live talks pipe: a small Claude API client with a fake for tests, and the spend book with its monthly cap. No game or world type in it, so the World Reader can use it too."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The game's crate already uses ureq for world downloads; there is no official Rust SDK.
ureq = { version = "2", features = ["json", "native-certs"] }
