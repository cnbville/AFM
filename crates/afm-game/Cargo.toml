[package]
name = "afm-game"
description = "The AFM game: your career on the engine's world, as commands the screens call (section 8)."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
afm-engine = { workspace = true }
# Live talks: the Claude API client, its fake and the spend book (no game types in it).
afm-ai = { workspace = true }
# The world build's allocator (`bin/afm_world.rs` only; the game keeps the system one).
mimalloc = "0.1.52"
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
ureq = { version = "2", features = ["json", "native-certs"] }
