[workspace]
resolver = "2"
members = ["crates/afm-engine", "crates/afm-tools", "crates/afm-game", "crates/afm-reader"]

[workspace.package]
version = "0.2.0"
edition = "2024"
publish = false

[workspace.dependencies]
afm-engine = { path = "crates/afm-engine" }

# Tests simulate whole national classes, so they run optimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 3
# Full debug info ran CI out of memory compiling the engine tests (13.7 GB);
# line tables still give backtraces their file and line.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
